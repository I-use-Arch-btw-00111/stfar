[package]
name = "stfar"
version = "0.1.0"
edition = "2024"
description = "STFAR - Some Touhou Fangame Attempt in Rust"
keywords = ["game", "bevy", "touhou"]
categories = ["games"]
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
opt-level     = 3
lto           = "fat"
strip         = true

[lints.rust]
unsafe_code     = "forbid"
unexpected_cfgs = "warn"

[lints.clippy]
unwrap_used          = "deny"
dbg_macro            = "warn"
format_push_string   = "warn"
use_self             = "warn"
manual_let_else      = "warn"
redundant_clone      = "warn"

[dependencies]
bevy = { version = "0.19.0", features = ["2d", "ui", "audio"] }
minstant = "0.1.7"
