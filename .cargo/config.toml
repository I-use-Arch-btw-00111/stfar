[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Ctarget-cpu=native", "-Clink-args=--ld-path=wild"]

[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = ["-Ctarget-cpu=native", "-Clink-args=--ld-path=wild"]

[target.x86_64-unknown-dragonfly]
linker = "clang"
rustflags = ["-Ctarget-cpu=native", "-Clink-args=--ld-path=lld"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
